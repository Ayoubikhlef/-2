name: Keep API warm

# Render's free instance sleeps after 15 minutes without traffic, and the
# first order after a sleep can take ~1 minute (cold start). A request every
# 5 minutes keeps the API ready for customers.
on:
  schedule:
    # GitHub may delay scheduled jobs under load; 5 minutes is the minimum.
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/keep-api-warm.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-api-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the public health endpoint
        run: |
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 70 \
              https://aos-tech.store/api/health || true)
            echo "attempt ${attempt} -> HTTP ${code}"
            if [ "${code}" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "health endpoint did not answer 200 after 3 attempts" >&2
          exit 1
