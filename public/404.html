<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#0b5ed7" />
    <title>الصفحة غير موجودة | AOS Tech Store - أوس تك</title>
    <link rel="icon" href="/icon-512.png" type="image/png" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px 18px;
        font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
        background:
          radial-gradient(circle at 50% 18%, rgba(11, 94, 215, 0.35), transparent 55%),
          radial-gradient(circle at 85% 90%, rgba(30, 58, 138, 0.45), transparent 55%),
          #070d1b;
        color: #e2e8f0;
        text-align: center;
      }
      main { width: 100%; max-width: 560px; }
      .logo { width: 64px; height: 64px; border-radius: 18px; margin-bottom: 18px; box-shadow: 0 18px 40px rgba(11, 94, 215, 0.35); }
      .code {
        margin: 0;
        font-size: clamp(5rem, 20vw, 7.5rem);
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.05em;
        background: linear-gradient(135deg, #7dd3fc, #2563eb 70%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 { margin: 14px 0 10px; font-size: clamp(1.25rem, 4vw, 1.6rem); }
      p { margin: 0 auto 10px; max-width: 460px; color: #94a3b8; line-height: 1.8; font-size: 0.95rem; }
      .brand { color: #cbd5e1; font-weight: 700; }
      .actions { margin-top: 26px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 46px;
        padding: 12px 22px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 0.95rem;
        text-decoration: none;
        transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
      }
      a.primary { background: #0b5ed7; color: #fff; box-shadow: 0 12px 28px rgba(11, 94, 215, 0.35); }
      a.primary:hover { background: #0a53be; transform: translateY(-1px); }
      a.ghost { border: 1px solid #334155; color: #e2e8f0; background: rgba(15, 23, 42, 0.6); }
      a.ghost:hover { border-color: #0b5ed7; transform: translateY(-1px); }
      .help { margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(148, 163, 184, 0.18); font-size: 0.85rem; color: #64748b; }
      .help a { color: #93c5fd; text-decoration: underline; text-underline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="/icon-512.png" width="64" height="64" alt="AOS Tech Store" />
      <p class="code">404</p>
      <h1>هذه الصفحة غير موجودة</h1>
      <p>
        قد يكون الرابط قديماً أو تم حذف الصفحة. لا تقلق — كل منتجات وخدمات
        <span class="brand">AOS Tech Store</span> (أوس تك / AOS Tech) ما زالت في مكانها.
      </p>
      <div class="actions">
        <a class="button primary" href="/">العودة إلى الرئيسية</a>
        <a class="button ghost" href="/#products">تصفّح المنتجات</a>
        <a class="button ghost" href="/#contact">اتصل بنا</a>
      </div>
      <p class="help">
        AOS Tech Store — Ayoub Office Services — El Milia, Jijel<br />
        <a href="https://wa.me/213674113290">واتساب: 0674 11 32 90</a>
      </p>
    </main>
  </body>
</html>
