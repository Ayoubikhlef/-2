<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Landing page preview</title>
<style>html,body{margin:0;padding:0;min-height:100%;background:#fff}body{font-family:system-ui,sans-serif;color:#64748b;display:grid;place-items:center;min-height:100vh}#hint{font-size:14px}</style>
</head>
<body>
<p id="hint">Loading preview…</p>
<script>
// The generated page is sent from the parent app. Nothing is uploaded: the
// product photo and copy stay in this browser. This document is served from a
// dedicated route with its own CSP so the optional 3D script can run.
addEventListener('message', function (event) {
  var data = event.data;
  if (!data || data.type !== 'aos-landing-preview' || typeof data.html !== 'string') return;
  document.open();
  document.write(data.html);
  document.close();
});
</script>
</body>
</html>
