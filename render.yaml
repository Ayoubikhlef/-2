databases:
  - name: aos-db
    databaseName: aos
    plan: free
    ipAllowList: []

services:
  - type: web
    name: aos-api
    env: node
    region: frankfurt
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma db push --accept-data-loss && npx tsx src/seed.ts && npx tsx src/index.ts
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "https://aos-tech.store,https://www.aos-tech.store,https://aostech.vercel.app,http://localhost:5173,http://localhost:4173,http://localhost:3001"
      # Storefront URL used in the links inside customer emails.
      - key: PUBLIC_SITE_URL
        value: "https://aos-tech.store"
      # Sender identity for account emails. It must be an address on a domain
      # verified in Resend, otherwise registration fails with a send error.
      - key: MAIL_FROM
        sync: false
      - key: NODE_ENV
        value: production
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: ADMIN_GATE_CODE
        sync: false
      # Security alerts - set these in the Render dashboard, never in git.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      # Render Free blocks SMTP ports, so email alerts use the Resend HTTPS API.
      - key: RESEND_API_KEY
        sync: false
      - key: SECURITY_ALERT_EMAIL
        sync: false
      - key: SECURITY_ALERT_FROM
        sync: false
      # Encrypted database snapshots. They stay disabled until the owner sets
      # a key in the dashboard and flips BACKUP_AUTO to true.
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      # Customer social sign-in. Create the apps in Google Cloud Console and
      # GitHub Developer Settings, then paste the credentials in the Render
      # dashboard. Redirect URIs:
      #   https://aos-tech.store/api/auth/oauth/google/callback
      #   https://aos-tech.store/api/auth/oauth/github/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: BACKUP_AUTO
        sync: false
      - key: BACKUP_HOUR_UTC
        value: "3"
      - key: BACKUP_GITHUB_REPO
        sync: false
      - key: BACKUP_GITHUB_TOKEN
        sync: false
      - key: BACKUP_GITHUB_PATH
        value: "backups"
      - key: BACKUP_DIR
        value: "backups"
      - key: BACKUP_KEEP
        value: "7"
      # AI Studio. Two ways to add a key, both server-side only:
      #   AI_API_KEY          — Gemini (free tier) https://aistudio.google.com/app/apikey
      #   OPENROUTER_API_KEY  — Claude and others https://openrouter.ai/keys
      # When OPENROUTER_API_KEY is set it runs first and the other configured
      # keys act as fallbacks; with no key, a free keyless provider is used.
      # Set AI_ALLOW_KEYLESS=false in the dashboard to disable that fallback.
      - key: AI_PROVIDER
        value: "gemini"
      - key: AI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Soft daily cap that protects the provider quota.
      - key: AI_DAILY_LIMIT
        value: "200"
